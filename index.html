<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#fff3f6" />
  <meta name="description" content="Một câu chuyện nhỏ dành riêng cho em." />
  <title>Một câu chuyện về em ♡</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=Dancing+Script:wght@500;600;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/scenes.css" />
  <link rel="stylesheet" href="css/responsive.css" />
  <link rel="stylesheet" href="css/reference-theme.css" />
</head>

<body>
  <div class="ambient" aria-hidden="true">
    <span class="orb orb-one"></span>
    <span class="orb orb-two"></span>
    <span class="orb orb-three"></span>
  </div>

  <audio id="music" loop preload="auto">
    <source src="assets/audio/our-song.mp3" type="audio/mpeg" />
  </audio>

  <header id="chrome" class="chrome hidden" aria-label="Điều hướng câu chuyện">
    <div class="progress-track">
      <div id="progressBar" class="progress-bar"></div>
    </div>
    <div class="chrome-row">
      <div id="chapterLabel" class="chapter-label"></div>
      <nav id="yearNav" class="year-nav" aria-label="Chọn năm"></nav>
      <button id="musicToggle" class="icon-btn muted" type="button" aria-label="Bật hoặc tắt nhạc">♫</button>
    </div>
  </header>

  <main id="experience" aria-live="polite">
    <section id="sceneRoot" class="scene-root"></section>
  </main>

  <div id="lightbox" class="lightbox" aria-hidden="true" role="dialog" aria-modal="true">
    <button id="lightboxClose" class="lightbox-close" type="button" aria-label="Đóng ảnh">×</button>
    <div id="lightboxMedia" class="lightbox-media"></div>
    <div id="lightboxCaption" class="lightbox-caption"></div>
  </div>

  <div id="particles" class="particles" aria-hidden="true"></div>

  <script src="data/media.js"></script>
  <script src="data/story.js"></script>
  <script src="js/app.js"></script>
</body>

</html>
